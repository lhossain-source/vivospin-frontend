name: Gemini AI Agent

on:
  issues:
    types: [opened, edited, labeled]
  issue_comment:
    types: [created]
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review]
  pull_request_review:
    types: [submitted]

permissions:
  contents: write
  issues: write
  pull-requests: write

concurrency:
  group: gemini-agent-${{ github.event.issue.number || github.event.pull_request.number || github.run_id }}
  cancel-in-progress: false

jobs:
  issue-agent:
    if: >-
      github.event_name == 'issues' ||
      (github.event_name == 'issue_comment' &&
       !github.event.issue.pull_request &&
       (contains(github.event.comment.body, '@agent') || contains(github.event.comment.body, '/fix')))
    runs-on: ubuntu-latest
    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Confirm task was requested
        id: gate
        env:
          EVENT_NAME: ${{ github.event_name }}
          ISSUE_BODY: ${{ github.event.issue.body }}
          ISSUE_TITLE: ${{ github.event.issue.title }}
          COMMENT_BODY: ${{ github.event.comment.body }}
          ISSUE_LABELS: ${{ join(github.event.issue.labels.*.name, ',') }}
        run: |
          python - <<'PY'
          import os
          event = os.environ.get("EVENT_NAME", "")
          text = "\n".join([os.environ.get("ISSUE_TITLE",""), os.environ.get("ISSUE_BODY",""), os.environ.get("COMMENT_BODY",""), os.environ.get("ISSUE_LABELS","")]).lower()
          requested = event == "issue_comment" and ("@agent" in text or "/fix" in text)
          requested = requested or (event == "issues" and ("@agent" in text or "/fix" in text or "ai-agent" in text))
          with open(os.environ["GITHUB_OUTPUT"], "a") as f:
              f.write("requested=" + ("true" if requested else "false") + "\n")
          PY
      - name: Set up Python
        if: steps.gate.outputs.requested == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Generate and validate changes
        if: steps.gate.outputs.requested == 'true'
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          TASK_TITLE: ${{ github.event.issue.title }}
          TASK_BODY: ${{ github.event.comment.body || github.event.issue.body }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: python .github/scripts/ai_agent.py implement
      - name: Commit changes and open a PR
        if: steps.gate.outputs.requested == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          TASK_TITLE: ${{ github.event.issue.title }}
        run: |
          if git diff --quiet; then
            echo "Agent produced no changes; nothing to commit."
            exit 0
          fi
          branch="ai-agent/issue-${ISSUE_NUMBER}-${GITHUB_RUN_ID}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "$branch"
          git add -A
          git commit -m "agent: address issue #${ISSUE_NUMBER}"
          git push origin "$branch"
          gh pr create --base main --head "$branch" --title "AI Agent: ${TASK_TITLE}" --body "Automated changes for #${ISSUE_NUMBER}. Review carefully before approving. Generated by Gemini; tests and human review are required."
          gh issue comment "${ISSUE_NUMBER}" --body "Gemini agent prepared a change set and opened a pull request. Review the PR and approve it to allow the approval workflow to merge it."
  
  review-pr:
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Gemini code review
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: python .github/scripts/ai_agent.py review

  merge-approved-agent-pr:
    if: >-
      github.event_name == 'pull_request_review' &&
      github.event.review.state == 'approved' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      startsWith(github.event.pull_request.head.ref, 'ai-agent/')
    runs-on: ubuntu-latest
    steps:
      - name: Merge approved agent PR
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: gh pr merge "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --squash --delete-branch
