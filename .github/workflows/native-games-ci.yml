name: Native games build check

on:
  push:
    branches:
      - feature/native-vivospin-games-suite
  pull_request:
    branches:
      - main
      - feature/native-vivospin-games-suite

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install dependencies
        run: npm install
      - name: Typecheck
        run: npm run typecheck
      - name: Build frontend
        run: npm run build
